
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- This is the title that appears at the very top of your browser tab -->
  <title>CSS Grid Layout and DevTools Verification</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grid-container-basic">
  <div class="grid-box">Box 1</div>
  <div class="grid-box">Box 2</div>
  <div class="grid-box">Box 3</div>
  <div class="grid-box">Box 4</div>
</div>

<div class="grid-container-autofit">
  <div class="grid-box">Box A</div>
  <div class="grid-box">Box B</div>
  <div class="grid-box">Box C</div>
  <div class="grid-box">Box D</div>
</div>

<div class="page-layout">
  <header class="header-area">Header Section</header>
  <aside class="sidebar-area">Sidebar Section</aside>
  <main class="main-area">Main Content Section</main>
  <footer class="footer-area">Footer Section</footer>
</div>

  <div class="grid-flex-container">
  <div class="grid-flex-box">
    <span class="box-icon">💡</span>
    <span class="box-text">Tip Content</span>
  </div>
  <div class="grid-flex-box">
    <span class="box-icon">🚀</span>
    <span class="box-text">Launch Content</span>
  </div>
</div>


</body>
</html>
