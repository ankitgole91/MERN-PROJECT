
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- This is the title that will appear on the browser tab bar -->
  <title>Mobile-First Responsive Layout and Git Workflow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mobile-First Layout & Media Queries-->
  
<div class="responsive-box">
  <h2>Responsive Viewport Tracking</h2>
  <p>The layout and background adjust smoothly based on current screen breakpoints.</p>
</div>
  
<!--Fluid Images and Scalable rem Font Units-->
  
<article class="content-card">
  <img src="https://placeholder.com" alt="Sample Showcase Asset" class="fluid-img">
  <div class="card-body">
    <h1 class="main-heading">Scalable Typography Heading</h1>
    <p class="sub-text">Fluid body text rendering context accurately proportional to rem metrics.</p>
  </div>
</article>



  
</body>
</html>
